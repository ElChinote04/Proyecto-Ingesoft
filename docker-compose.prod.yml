# Despliegue en un único servidor. Uso, desde la raíz del repositorio:
#   docker compose -f docker-compose.prod.yml --env-file deploy/.env up -d --build
# Guía completa: docs/DESPLIEGUE_AWS.md.
name: sage
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: sage
      POSTGRES_USER: sage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en deploy/.env}
    volumes:
      - sage_postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sage -d sage']
      interval: 3s
      timeout: 3s
      retries: 20

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: production
      TRUST_PROXY: 1
      DATABASE_URL: postgresql://sage:${POSTGRES_PASSWORD}@db:5432/sage
      FRONTEND_URL: https://${SAGE_DOMINIO:?Falta SAGE_DOMINIO en deploy/.env}
      JWT_SECRET: ${JWT_SECRET:?Falta JWT_SECRET en deploy/.env}
      INITIAL_SETUP_KEY: ${INITIAL_SETUP_KEY:?Falta INITIAL_SETUP_KEY en deploy/.env}
      PAGOS_PROVEEDOR: stripe
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:?Falta STRIPE_SECRET_KEY en deploy/.env}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:?Falta STRIPE_WEBHOOK_SECRET en deploy/.env}

  web:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      SAGE_DOMINIO: ${SAGE_DOMINIO}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  sage_postgres:
  caddy_data:
  caddy_config:
