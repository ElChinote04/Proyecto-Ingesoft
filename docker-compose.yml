name: sage-prototipo
services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_DB: sage
      POSTGRES_USER: sage
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Ejecute npm run setup para crear .env}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - sage_postgres:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U sage -d sage']
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  sage_postgres:
